<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<title>澳漂世界</title>
<meta name="description" content="基于真实地图的 2.5D 澳洲华人生活游戏原型">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"></div>

<!-- HUD：叠在画布上的 HTML -->
<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-place"><span id="hud-city">墨尔本</span> · <b id="hud-area">Box Hill</b></div>
    <div class="hud-right">
      <button id="btn-quests" class="chip">📜 任务 <span id="quest-badge" class="badge hidden">0</span></button>
      <button id="btn-bag" class="chip">🎒 背包</button>
      <button id="btn-back" class="chip">← 换城市</button>
    </div>
  </div>
  <div class="hud-mid">
    <div id="hud-stats" class="stats"></div>
    <div id="tracker" class="tracker hidden"></div>
  </div>
  <div class="hud-bottom">
    <div class="hint">点地面走路 · 点 NPC 对话 · 拖动看地图 · 双指缩放</div>
    <div class="attrib">地图数据 © OpenStreetMap contributors</div>
  </div>
</div>

<!-- 对话面板 -->
<div id="dialog" class="dialog hidden">
  <div class="dialog-card">
    <div class="dialog-portrait" id="dialog-portrait">🧑</div>
    <div class="dialog-main">
      <div class="dialog-head"><b id="dialog-name"></b> <span id="dialog-role" class="muted"></span></div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-options" id="dialog-options"></div>
      <div class="dialog-next" id="dialog-next">点击继续 ▸</div>
    </div>
  </div>
</div>

<!-- 奖励 -->
<div id="reward" class="modal hidden">
  <div class="modal-card center">
    <div class="reward-emoji">🎉</div>
    <h3 id="reward-title">任务完成</h3>
    <ul id="reward-list" class="reward-list"></ul>
    <button id="reward-ok" class="btn btn-primary">收下</button>
  </div>
</div>

<!-- 任务面板 -->
<div id="panel-quests" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>任务</h3><button class="chip" data-close="#panel-quests">关闭</button></div>
    <div id="quests-body" class="panel-body"></div>
    <div class="row-links"><button id="btn-reset" class="link small">清空存档重新开始</button><a class="link small" href="index.html">方块版 →</a> <a class="link small" href="merchant.html">商家核销入口 →</a></div>
  </div>
</div>

<!-- 背包 -->
<div id="panel-bag" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>背包</h3><button class="chip" data-close="#panel-bag">关闭</button></div>
    <div id="bag-body" class="panel-body"></div>
  </div>
</div>

<!-- 出示优惠券 -->
<div id="panel-coupon" class="modal hidden">
  <div class="modal-card center coupon-panel">
    <div class="cp-merchant" id="cp-merchant"></div>
    <div class="cp-text" id="cp-text"></div>
    <div class="cp-wrap" id="cp-wrap"><canvas id="cp-canvas" width="480" height="480"></canvas><div class="cp-void" id="cp-void"></div></div>
    <div class="cp-timer" id="cp-timer"></div>
    <div class="cp-hint">请店员用手机相机扫码核销</div>
    <div class="cp-terms" id="cp-terms"></div>
    <div class="row">
      <button id="cp-used" class="btn btn-ghost">已在店里用掉</button>
      <button class="btn btn-primary" data-close="#panel-coupon">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- 商家弹窗 -->
<div id="poi" class="poi hidden">
  <div class="poi-card">
    <div class="poi-kind" id="poi-kind"></div>
    <div class="poi-name" id="poi-name"></div>
    <div class="poi-sub" id="poi-sub"></div>
    <div class="poi-quest">📜 任务即将开放 · 商家优惠券即将开放</div>
    <div class="row">
      <button id="poi-go" class="btn btn-primary">走过去</button>
      <button id="poi-close" class="btn btn-ghost">关闭</button>
    </div>
  </div>
</div>

<div id="loading" class="loading">
  <div class="loading-tram">🚋</div>
  <div>正在从真实地图搭建 Box Hill…</div>
</div>

<script src="js/boot.js"></script>
</body>
</html>
