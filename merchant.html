<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<title>澳漂世界 · 商家核销</title>
<link rel="stylesheet" href="css/merchant.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">澳漂世界 · 商家核销</div><div id="store-name" class="store"></div></div>
    <button id="btn-logout" class="chip hidden">退出</button>
  </header>

  <!-- 登录 -->
  <section id="view-login" class="card hidden">
    <h2>商家登录</h2>
    <p id="login-note" class="muted"></p>
    <label>门店<select id="sel-store"></select></label>
    <label>核销口令<input id="inp-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="向澳漂世界索取"></label>
    <button id="btn-login" class="btn primary">登录</button>
    <p id="login-err" class="err"></p>
    <p class="muted small">原型阶段：演示口令写在项目内容文件里，正式版改成账号登录。</p>
  </section>

  <!-- 主界面 -->
  <section id="view-main" class="hidden">
    <div class="stats">
      <div><b id="st-today">0</b><span>今日核销</span></div>
      <div><b id="st-total">0</b><span>累计核销</span></div>
    </div>
    <button id="btn-scan" class="btn primary big">📷 扫码核销</button>
    <div class="alt">
      <label class="link">上传二维码图片<input id="inp-file" type="file" accept="image/*" hidden></label>
      <button id="btn-paste" class="link">粘贴券码</button>
    </div>
    <div id="paste-box" class="card hidden">
      <textarea id="inp-code" rows="3" placeholder="粘贴二维码里的链接或券码"></textarea>
      <button id="btn-check" class="btn primary">校验</button>
    </div>

    <div id="result" class="result hidden"></div>

    <div class="card">
      <div class="row-between"><h3>核销记录</h3><button id="btn-csv" class="link">导出 CSV</button></div>
      <div id="ledger"></div>
    </div>
  </section>
</div>

<!-- 扫码 -->
<div id="scanner" class="scanner hidden">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="scan-tip">把顾客手机上的二维码放进框里</div>
  <button id="btn-scan-close" class="btn ghost">取消</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="js/content_boxhill.js"></script>
<script src="js/coupon.js"></script>
<script src="js/merchant.js"></script>
</body>
</html>
